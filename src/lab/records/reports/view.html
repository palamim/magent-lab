<!-- src/lab/records/reports/view.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>magent-lab — experiment report</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <style>
    body { font-family: 'Georgia', serif; max-width: 920px; margin: 40px auto; padding: 0 20px; color: #1a1a1a; background: #fafafa; }
    h1 { font-size: 22px; } h2 { font-size: 15px; margin-top: 36px; color: #333; text-transform: uppercase; letter-spacing: 0.05em; }
    .meta { color: #999; font-size: 12px; }
    .chart-wrap { background: #fff; border: 1px solid #e5e5e5; border-radius: 8px; padding: 20px; margin: 14px 0; }
    table { border-collapse: collapse; width: 100%; font-size: 13px; margin-top: 8px; }
    td, th { border: 1px solid #e5e5e5; padding: 6px 10px; text-align: left; }
    th { background: #f5f5f5; }
    .load-hint { color: #888; font-size: 13px; }
  </style>
</head>
<body>
  <h1>Experiment report</h1>
  <p class="meta" id="meta"></p>
  <p class="load-hint" id="hint">Loading… (serve over http, and pass ?f=&lt;experimentId&gt;.json)</p>

  <h2>Gate-pass rate by subject</h2>
  <div class="chart-wrap"><canvas id="passRate"></canvas></div>

  <h2>Exploration & cost by subject</h2>
  <div class="chart-wrap"><canvas id="behavior"></canvas></div>

  <h2>Head-to-head</h2>
  <div class="chart-wrap"><canvas id="h2h"></canvas></div>

  <h2>Gate failures by criterion</h2>
  <div class="chart-wrap"><canvas id="gateFailures"></canvas></div>

  <h2>Summary table</h2>
  <div id="table"></div>

  <script>
    const MAGENTA = '#d81b8c', GRAY = '#8a8a8a', BLUE = '#3b82f6', DIM = '#ccc';
    const palette = [MAGENTA, GRAY, BLUE, '#f59e0b'];

    // which report file to load: ?f=<experimentId>.json, defaults to output/latest.json
    const params = new URLSearchParams(location.search);
    const file = params.get('f') ? `output/${params.get('f')}` : 'output/latest.json';

    fetch(file)
      .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then((data) => {
        document.getElementById('hint').style.display = 'none';
        document.getElementById('meta').textContent = `Experiment ${data.experimentId} — generated ${data.generatedAt}`;

        const subjects = data.summary.map((s) => `${s.subject}\n(${s.model})`);
        const colorBy = (i) => palette[i % palette.length];

        // 1. gate-pass rate
        new Chart(document.getElementById('passRate'), {
          type: 'bar',
          data: { labels: subjects, datasets: [{ data: data.summary.map((s) => (s.passRate * 100).toFixed(1)), backgroundColor: data.summary.map((_, i) => colorBy(i)) }] },
          options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, max: 100, title: { display: true, text: '% plans passing all gates' } } } },
        });

        // 2. behavior — reads + steps (bars), cost as a second axis
        new Chart(document.getElementById('behavior'), {
          type: 'bar',
          data: {
            labels: subjects,
            datasets: [
              { label: 'avg read_file', data: data.summary.map((s) => s.avgReadFileCalls.toFixed(1)), backgroundColor: MAGENTA, yAxisID: 'y' },
              { label: 'avg steps', data: data.summary.map((s) => s.avgSteps.toFixed(1)), backgroundColor: GRAY, yAxisID: 'y' },
              { label: 'avg cost ($)', data: data.summary.map((s) => s.avgCostUsd.toFixed(5)), type: 'line', borderColor: BLUE, yAxisID: 'yCost' },
            ],
          },
          options: { scales: { y: { beginAtZero: true, position: 'left' }, yCost: { beginAtZero: true, position: 'right', grid: { drawOnChartArea: false }, title: { display: true, text: 'cost $' } } } },
        });

        // 3. head-to-head winners
        const wLabels = data.headToHead.map((h) => `${h.winner} (${h.decidedBy})`);
        new Chart(document.getElementById('h2h'), {
          type: 'bar',
          data: { labels: wLabels, datasets: [{ data: data.headToHead.map((h) => h.count), backgroundColor: data.headToHead.map((h) => h.winner === 'A' ? GRAY : h.winner === 'B' ? MAGENTA : DIM) }] },
          options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } },
        });

        // 4. gate failures by criterion (horizontal)
        new Chart(document.getElementById('gateFailures'), {
          type: 'bar',
          data: { labels: data.gateFailures.map((g) => `${g.criterion} (${g.subject})`), datasets: [{ data: data.gateFailures.map((g) => g.failures), backgroundColor: MAGENTA }] },
          options: { indexAxis: 'y', plugins: { legend: { display: false } }, scales: { x: { beginAtZero: true, ticks: { stepSize: 1 } } } },
        });

        // table
        const rows = data.summary.map((s) =>
          `<tr><td>${s.subject}</td><td>${s.model}</td><td>${s.n}</td><td>${(s.passRate*100).toFixed(0)}%</td><td>${s.avgReadFileCalls.toFixed(1)}</td><td>${s.avgSteps.toFixed(1)}</td><td>${Math.round(s.avgLatencyMs)}ms</td><td>$${s.avgCostUsd.toFixed(5)}</td></tr>`
        ).join('');
        document.getElementById('table').innerHTML =
          `<table><tr><th>subject</th><th>model</th><th>n</th><th>pass</th><th>reads</th><th>steps</th><th>latency</th><th>cost</th></tr>${rows}</table>`;
      })
      .catch((e) => { document.getElementById('hint').textContent = `Failed to load ${file} — serve over http (npx serve) and pass ?f=<experimentId>.json. (${e})`; });
  </script>
</body>
</html>
