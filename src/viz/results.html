<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>magent-lab results</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <style>
    body { font-family: 'Georgia', serif; max-width: 900px; margin: 40px auto; padding: 0 20px; color: #1a1a1a; background: #fafafa; }
    h1 { font-size: 22px; }
    h2 { font-size: 16px; margin-top: 40px; color: #333; }
    .chart-wrap { background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; padding: 20px; margin: 16px 0; }
    .meta { color: #888; font-size: 12px; }
    table { border-collapse: collapse; width: 100%; font-size: 13px; }
    td, th { border: 1px solid #e0e0e0; padding: 6px 10px; text-align: left; }
    th { background: #f5f5f5; }
  </style>
</head>
<body>
  <h1>magent-lab — planner prompt experiment</h1>
  <p class="meta" id="meta"></p>

  <h2>Head-to-head winners (A = baseline, B = distinct-deliverables)</h2>
  <div class="chart-wrap"><canvas id="winners"></canvas></div>

  <h2>Gate-pass rate by config</h2>
  <div class="chart-wrap"><canvas id="passRate"></canvas></div>

  <h2>Gate failures by criterion</h2>
  <div class="chart-wrap"><canvas id="gateFailures"></canvas></div>

  <h2>Exploration & cost by config</h2>
  <div class="chart-wrap"><canvas id="behavior"></canvas></div>

  <h2>Raw summary</h2>
  <div id="table"></div>

  <script>
    const MAGENTA = '#d81b8c';
    const GRAY = '#8a8a8a';

    fetch('results.json')
      .then((r) => r.json())
      .then((data) => {
        document.getElementById('meta').textContent = 'Generated ' + data.generatedAt;

        // config label helper
        const labelFor = (c) => c === 'baseline' ? 'baseline' : 'distinct-deliverables';
        const colorFor = (c) => c === 'baseline' ? GRAY : MAGENTA;

        // 1. winners
        const wOrder = ['A', 'B', 'tie'];
        const wLabels = ['A (baseline)', 'B (distinct-deliverables)', 'tie'];
        const wCounts = wOrder.map((w) => (data.winners.find((x) => x.winner === w)?.count) ?? 0);
        new Chart(document.getElementById('winners'), {
          type: 'bar',
          data: { labels: wLabels, datasets: [{ data: wCounts, backgroundColor: [GRAY, MAGENTA, '#ccc'] }] },
          options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } },
        });

        // 2. pass rate
        new Chart(document.getElementById('passRate'), {
          type: 'bar',
          data: {
            labels: data.summary.map((s) => labelFor(s.config)),
            datasets: [{ data: data.summary.map((s) => (s.passRate * 100).toFixed(1)), backgroundColor: data.summary.map((s) => colorFor(s.config)) }],
          },
          options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, max: 100, title: { display: true, text: '% plans passing all gates' } } } },
        });

        // 3. gate failures by criterion
        new Chart(document.getElementById('gateFailures'), {
          type: 'bar',
          data: {
            labels: data.gateFailures.map((g) => g.criterion),
            datasets: [{ data: data.gateFailures.map((g) => g.failures), backgroundColor: MAGENTA }],
          },
          options: { indexAxis: 'y', plugins: { legend: { display: false } }, scales: { x: { beginAtZero: true, ticks: { stepSize: 1 } } } },
        });

        // 4. behavior — avg read_file calls (bars) + avg cost (line)
        new Chart(document.getElementById('behavior'), {
          type: 'bar',
          data: {
            labels: data.summary.map((s) => labelFor(s.config)),
            datasets: [
              { label: 'avg read_file calls', data: data.summary.map((s) => s.avgReadFileCalls.toFixed(1)), backgroundColor: data.summary.map((s) => colorFor(s.config)), yAxisID: 'y' },
            ],
          },
          options: { plugins: { legend: { display: true } }, scales: { y: { beginAtZero: true, title: { display: true, text: 'avg read_file calls' } } } },
        });

        // raw table
        const rows = data.summary.map((s) =>
          `<tr><td>${labelFor(s.config)}</td><td>${s.n}</td><td>${(s.passRate*100).toFixed(1)}%</td><td>${s.avgReadFileCalls.toFixed(1)}</td><td>${Math.round(s.avgLatencyMs)}ms</td><td>$${s.avgCostUsd.toFixed(5)}</td></tr>`
        ).join('');
        document.getElementById('table').innerHTML =
          `<table><tr><th>config</th><th>n</th><th>gate-pass</th><th>avg reads</th><th>avg latency</th><th>avg cost</th></tr>${rows}</table>`;
      })
      .catch((e) => { document.body.innerHTML += '<p style="color:red">Failed to load results.json — run analyze.ts first, and open this page over http (not file://).</p>'; });
  </script>
</body>
</html>
